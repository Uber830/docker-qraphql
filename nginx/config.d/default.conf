upstream nodejs_cluster {
    least_conn; # Load balancing method: least connections
    # Define the backend servers for the Node.js application
    server web1:3000;
    server web2:3000;
    server web3:3000;
}

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name localhost;

    return 301 https://$host:8443$request_uri;
}

server {
    # Listen on port 443 for incoming HTTPS requests
    listen 443 ssl;
    # Define the server name (can be changed to your domain or IP)
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key; # Path to the SSL certificate key

    # Proxy requests to the Node.js cluster
    location / {
        # Forward the request to the Node.js cluster defined above
        proxy_pass http://nodejs_cluster;
        # Set the HTTP version to 1.1 for WebSocket support
        proxy_http_version 1.1;
        # Set headers to maintain client information and support WebSockets
        proxy_set_header Host $host;
        # Set the X-Real-IP header to the client's IP address
        proxy_set_header X-Real-IP $remote_addr;
        # Set the X-Forwarded-For header to the client's IP address and any existing forwarded IPs
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Set the X-Forwarded-Proto header to the original request scheme (http or https)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}